# Copy to .streamlit/secrets.toml (git-ignored) and uncomment only what you use.
# Order of precedence: command-line flags > secrets.toml > environment variables.
# Leave unused keys commented out: an empty value also hides an environment variable.
# YOUTUBE_API_KEY = "..."
# OPENAI_API_KEY = "..."
# GCP_CREDENTIALS_PATH = "/path/service-account.json"
# GCP_PROJECT_ID = "..."
